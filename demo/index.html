<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="robots" content="index,follow">
  <title>OpsDeck · Safe Demo</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./demo-provider.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header id="opsdeck-demo-shell">
    <div id="opsdeck-safe-demo-banner" role="status">SAFE DEMO · SANITIZED SAMPLE DATA · NO IRIS CONNECTION</div>
    <div id="opsdeck-demo-access-anchor">
      <div id="opsdeck-demo-access-row">
        <label id="opsdeck-demo-persona">
          <span class="demo-access-full-label">DEMO ACCESS:</span>
          <span class="demo-access-compact-label" aria-hidden="true">Demo</span>
          <select aria-label="Demo access persona"></select>
        </label>
        <a class="demo-repo-link" href="https://github.com/KennethJSmithDev/OpsDeck" aria-label="Return to the OpsDeck GitHub repository">↗ GitHub Repository</a>
      </div>
    </div>
  </header>
  <div id="app" aria-live="polite"></div>
</body>
</html>
